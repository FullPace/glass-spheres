[tab MANUAL]
art file=skin/glass_spheres_bg.jpg
enum_v cx=150 cy=430 label="" key=manual_page sw=220 options="BASICS,T SECTION,X SECTION,Y & DEJA VU,CLOCK,MODULATION,CV OUTPUT,MIDI OUTPUT"
text cx=320 cy=214 label="BASICS" size=1.8 weight=700 color=c83d58 align=left when=manual_page:0
text cx=320 cy=254 label="Glass Spheres is a random sampler after Mutable Instruments Marbles: it makes random gates (T section)," size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=289 label="random voltages or notes (X section) and a slow random modulation (Y), and it can repeat what it" size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=324 label="made (DEJA VU). It makes no sound itself: it plays synths over the MPC X's CV jacks or over MIDI." size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=394 label="GLASS SPHERES tab: laid out like the module: T on the left, DEJA VU in the middle, X on the right." size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=429 label="Y / CLOCK: the Y section, clock and gates. MODULATION: envelopes, LFOs, matrix. OUTPUT: CV or MIDI." size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=499 label="Quick start (MIDI): OUTPUT = MIDI, make a MIDI track with input Glass Spheres 1 and an instrument," size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=534 label="set its monitoring on. Quick start (CV): OUTPUT = CV, X1 to CV 1 (pitch), T1 to CV 2 (gate)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:0
text cx=320 cy=214 label="T SECTION" size=1.8 weight=700 color=c83d58 align=left when=manual_page:1
text cx=320 cy=254 label="Random gates on three outputs: t1, t2 (the clock itself) and t3." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=324 label="T RATE: the clock speed (with an external clock: multiplies or divides it)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=359 label="T BIAS: which of t1 / t3 gets more gates (Coin Toss), or the pattern's density in other models." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=394 label="JITTER: shifts the gates off the grid, up to fully random timing." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=429 label="GATE LENGTH / GATE RANDOM (Y / CLOCK tab): the gates' length and how much it varies." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=464 label="T MODEL: Coin Toss, Clusters, Drums, Independent, Divider, Three States, Markov:" size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=499 label="how t1 and t3 relate to the clock (e.g. Drums plays kick/snare-like patterns)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=534 label="T RANGE (beside LENGTH): the clock's range, 1/4x, 1x or 4x." size=1.45 weight=600 color=1a1919 align=left when=manual_page:1
text cx=320 cy=214 label="X SECTION" size=1.8 weight=700 color=c83d58 align=left when=manual_page:2
text cx=320 cy=254 label="Three random voltages X1, X2, X3: melodies when quantized." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=324 label="X SPREAD: how far the values spread (low: close to the bias, high: anywhere)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=359 label="X BIAS: the centre of the values (low notes / high notes)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=394 label="X STEPS: below 12 o'clock smooth glides, above it quantized to the SCALE; fully right = only the" size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=429 label="scale's most important notes." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=464 label="SCALE: Major, Minor, Pentatonic, Pelog, Bhairav, Shri." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=499 label="X MODE: Identical (all three alike), Bump (X2 in the middle), Tilt (X1 to X3 tilted)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=534 label="X CLOCK (Y / CLOCK tab): which gate updates X: T1+T2+T3 (each its own), or all from T1, T2 or T3." size=1.45 weight=600 color=1a1919 align=left when=manual_page:2
text cx=320 cy=214 label="Y & DEJA VU" size=1.8 weight=700 color=c83d58 align=left when=manual_page:3
text cx=320 cy=254 label="Y: a fourth random voltage, slower: for filters, levels, effect sends." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=289 label="Y SPREAD, Y BIAS, Y STEPS as for X. Y DIVIDER: Y changes every n clock pulses (1/1 .. 1/64)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=359 label="DEJA VU: 12 o'clock = the last LENGTH steps repeat exactly (a loop). Left of it: new random values" size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=394 label="mixed in more and more, fully left = always new. Right of it: the loop is shuffled." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=429 label="LENGTH: the loop length in steps (1 .. 16)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=464 label="t DEJA VU / X DEJA VU (top corners): Off, On (follows the knob) or Locked (always repeats) for the" size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=499 label="gates and the voltages separately: e.g. a fixed rhythm with new notes." size=1.45 weight=600 color=1a1919 align=left when=manual_page:3
text cx=320 cy=214 label="CLOCK" size=1.8 weight=700 color=c83d58 align=left when=manual_page:4
text cx=320 cy=254 label="CLOCK: Internal (T RATE alone), MPC (locked to the MPC's tempo and transport) or MIDI." size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=324 label="MPC: the pattern restarts when the MPC starts playing; MPC CLOCK sets the note value of" size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=359 label="the clock (1/4 .. 1/32), T RATE then multiplies or divides it. Nothing plays while the MPC is stopped." size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=394 label="MIDI: notes on Glass Spheres' own track clock it, one step per note: draw the rhythm in the piano" size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=429 label="roll. MIDI TRIGGER: Any Note, One Note (only TRIGGER NOTE), or Learn (the next note you play" size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=464 label="becomes the trigger note)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:4
text cx=320 cy=214 label="MODULATION" size=1.8 weight=700 color=c83d58 align=left when=manual_page:5
text cx=320 cy=254 label="Two envelopes, two LFOs and an 8-slot matrix, like patch cables into the module's CV inputs." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=324 label="Sources: LFO 1/2, Env 1/2, Glass Spheres' own outputs T1-T3, X1-X3 and Y (patched back into its" size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=359 label="inputs, as on the module), and the velocity of notes on its own track." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=394 label="Destinations: T Rate, T Bias, Jitter, Deja Vu, Steps, Spread, X Bias (added to the knobs), and" size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=429 label="T Clock / X Clock: a slot there clocks that section like a cable in the module's CLOCK jack (on above 50 %)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=464 label="ENV TRIGGER: MIDI notes, LFO 1 / LFO 2 or the gates T1-T3. LFO SYNC locks the rate to the MPC's tempo." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=499 label="Ideas: Y onto T Rate (a drifting tempo), Env 1 triggered by T1 onto Spread, X1 onto Deja Vu." size=1.45 weight=600 color=1a1919 align=left when=manual_page:5
text cx=320 cy=214 label="CV OUTPUT" size=1.8 weight=700 color=c83d58 align=left when=manual_page:6
text cx=320 cy=254 label="OUTPUT = CV: the seven outputs go to the MPC X's CV/Gate jacks (0 .. 5 V). Assign each one to a jack" size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=289 label="on the OUTPUT tab; Off leaves it unused. Several instances can share the jacks: the latest assignment" size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=324 label="of a jack wins." size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=394 label="Gates (T1-T3): 5 V while open. X1-X3 and Y: 1 V/octave with X RANGE 0-2V or 0-5V; +/-5V is" size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=429 label="squeezed into 0-5 V (smooth, but no longer 1 V/octave)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=464 label="Don't use the same jacks on CV tracks: the MPC sets those to 0 V when the transport stops." size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=499 label="Typical: X1 to a VCO's pitch, T1 to its envelope's gate, Y to the filter cutoff." size=1.45 weight=600 color=1a1919 align=left when=manual_page:6
text cx=320 cy=214 label="MIDI OUTPUT" size=1.8 weight=700 color=c83d58 align=left when=manual_page:7
text cx=320 cy=254 label="OUTPUT = MIDI: every Glass Spheres has its own MIDI output, Glass Spheres 1, Glass Spheres 2, ..." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=289 label="On another track (plug-in, keygroup, drum...) pick it as MIDI input, the voice's channel, monitoring on." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=359 label="Like patching the module's outputs to different modules: three VOICES and two CC lanes." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=394 label="VOICE: GATE (T1-T3) opens a note, PITCH picks X1-X3 or Y at 1 V = 12 semitones above NOTE, or" size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=429 label="Fixed (always NOTE: drums, e.g. 36 kick on T2, 38 snare on T3). CHANNEL: one track per channel." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=464 label="CC: SOURCE X1-X3 or Y over its range as 0..127, on CHANNEL as controller CC (1 mod wheel, 74 cutoff)." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
text cx=320 cy=499 label="Use SCALE and STEPS above 12 o'clock for notes in key; X CLOCK = T1+T2+T3 gives each voice its own." size=1.45 weight=600 color=1a1919 align=left when=manual_page:7
qlinks "MANUAL" = manual_page
